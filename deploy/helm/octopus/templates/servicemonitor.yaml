{{- if .Values.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "octopus.fullname" . }}
  labels:
    {{- include "octopus.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- $admin := include "octopus.adminListenPort" . }}
  selector:
    matchLabels:
      {{- include "octopus.selectorLabels" . | nindent 6 }}
      {{- if $admin }}
      app.kubernetes.io/component: admin
      {{- end }}
  endpoints:
    # Metrics live on the private admin Service once config.admin.listen is set.
    - port: {{ if $admin }}admin{{ else }}http{{ end }}
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
